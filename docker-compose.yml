# Servicios base. Toda la configuración sale de .env (ver .env.example);
# ${VAR:?} hace fallar a compose si falta una variable.
services:
  postgres:
    build: ./postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB no definida}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER no definida}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      # Rol de la aplicación (sin superusuario): lo crea y rota el entrypoint en cada arranque.
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:?POSTGRES_APP_USER no definida}
      POSTGRES_APP_PASSWORD_FILE: /run/secrets/postgres_app_password
    secrets:
      - postgres_password
      - postgres_app_password
    volumes:
      - pgdata:/var/lib/postgresql
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  api:
    build: .
    environment:
      API_PORT: ${API_PORT:?API_PORT no definida}
      LOG_LEVEL: ${API_LOG_LEVEL:?API_LOG_LEVEL no definida}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB no definida}
      POSTGRES_USER: ${POSTGRES_APP_USER:?POSTGRES_APP_USER no definida}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_app_password
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:?POSTGRES_SSLMODE no definida}
      JWT_PUBLIC_KEY_FILE: /run/secrets/jwt_public_key
      JWT_ISSUER: ${JWT_ISSUER:?JWT_ISSUER no definida}
      JWT_AUDIENCE: ${JWT_AUDIENCE:?JWT_AUDIENCE no definida}
      MAX_BODY_BYTES: ${MAX_BODY_BYTES:?MAX_BODY_BYTES no definida}
      ITEM_TITLE_MAX: ${ITEM_TITLE_MAX:?ITEM_TITLE_MAX no definida}
      ITEM_DESCRIPTION_MAX: ${ITEM_DESCRIPTION_MAX:?ITEM_DESCRIPTION_MAX no definida}
      ITEMS_PAGE_LIMIT: ${ITEMS_PAGE_LIMIT:?ITEMS_PAGE_LIMIT no definida}
    secrets:
      - postgres_app_password
      - jwt_public_key
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
      - shared
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

# Archivos generados por `make secrets` (secrets/ está en .gitignore).
secrets:
  postgres_password:
    file: ./secrets/postgres_password
  postgres_app_password:
    file: ./secrets/postgres_app_password
  jwt_public_key:
    file: ./secrets/jwt_public_key

volumes:
  pgdata:

networks:
  shared:
    name: ${SHARED_NETWORK:?SHARED_NETWORK no definida}
    external: true
