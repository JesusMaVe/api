# Servicios base. Toda la configuración sale de .env (ver .env.example);
# ${VAR:?} hace fallar a compose si falta una variable.
services:
  postgres:
    build: ./postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB no definida}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER no definida}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - pgdata:/var/lib/postgresql
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

# Archivos generados por `make secrets` (secrets/ está en .gitignore).
secrets:
  postgres_password:
    file: ./secrets/postgres_password
  jwt_public_key:
    file: ./secrets/jwt_public_key

volumes:
  pgdata:
